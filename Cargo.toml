[package]
name = "rmt"
version = "0.1.4"
authors = ["Arc <attobop@gmail.com>"]
edition = "2021"
rust-version = "1.75"
description = "Random matrix theory primitives"
license = "MIT OR Apache-2.0"
include = [
  "/src/**/*.rs",
  "/examples/**/*.rs",
  "/Cargo.toml",
  "/CHANGELOG.md",
  "/LICENSE*",
  "/README.md",
]
repository = "https://github.com/arclabs561/rmt"
homepage = "https://github.com/arclabs561/rmt"
documentation = "https://docs.rs/rmt"
keywords = ["random-matrix", "eigenvalue", "marchenko-pastur", "wigner", "statistics"]
categories = ["algorithms", "science", "mathematics"]

[workspace]

[dependencies]
ndarray = "0.17"
rand = "0.9"
rand_distr = "0.5"

[dev-dependencies]
proptest = "1.9"
